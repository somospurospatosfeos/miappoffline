name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libltdl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.33 virtualenv

      - name: Accept Android licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk
          # Pre-aceptamos licencias para que no pregunte
          mkdir -p /home/runner/.android
          echo "y" > /home/runner/.android/repositories.cfg || true

      - name: Build APK
        run: |
          yes | buildozer -v android debug || true
          buildozer -v android debug
        env:
          ACCEPT_SDK_LICENSE_AGREEMENTS: "1"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
